# Tool configuration only. Dependencies live in requirements*.in and the hashed requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF", "N", "A", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a running llama-server; skipped in CI"]

[tool.coverage.run]
source = ["linkfall"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
