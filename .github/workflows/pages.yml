name: pages

# Deploys the hosted demo (ADR 0012) from a release tag. Manual only: someone presses the button and
# names the tag. The build checks every runtime file against its hash and runs the Python suite on
# the shipped Pyodide set before anything is uploaded. Rollback: run it again with the previous tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v1.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: The input is a release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install from the hashed lockfile
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Build the site, every runtime file hash-checked
        run: python scripts/build_pages.py --out dist
      - name: Fetch pytest wheels, hash-checked
        run: python scripts/fetch_test_wheels.py
      - name: Python suite on Pyodide with the files about to ship
        run: node scripts/test_pyodide.mjs --dist dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
